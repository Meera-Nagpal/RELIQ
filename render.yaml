services:
  - type: web
    name: reliq-backend
    runtime: node
    plan: free
    region: oregon
    branch: main
    autoDeployTrigger: "off"
    buildCommand: npm install && npm run build:backend
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: HOST
        value: 0.0.0.0
      - key: RELIQ_DB_DRIVER
        value: supabase_postgresql
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: EVALUATION_CACHE_ENABLED
        value: "true"
      - key: EVALUATION_CONCURRENCY
        value: "8"
      - key: PROVIDER_REQUEST_DELAY_MS
        value: "100"
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: CEREBRAS_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
